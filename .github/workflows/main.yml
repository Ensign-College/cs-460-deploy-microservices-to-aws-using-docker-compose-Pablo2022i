name: Autograding

on:
  push:
    branches: [ main, pablo-recommendation-lab ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test with Maven
        run: mvn -B clean verify

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports

  autograde:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Display grading success
        run: echo "✅ Autograding completed successfully!"
